# Copy this file to references/team-map.local.yaml and replace placeholders.

board:
  id: "1"
  project_keys:
    - "KAN"

defaults:
  dry_run: true
  backlog_jql: "project in (KAN) AND statusCategory != Done AND sprint is EMPTY ORDER BY priority DESC, created ASC"
  active_sprint_jql: "project in (KAN) AND sprint in openSprints() ORDER BY Rank ASC"
  fields: "summary,status,assignee,priority,components,labels,updated,created,duedate"
  stale_after_days: 3
  standup_lookback_days: 1
  blocked_statuses:
    - "Blocked"
    - "On Hold"
  active_statuses:
    - "In Progress"
    - "In Review"
    - "Testing"
  done_statuses:
    - "Done"
    - "Closed"
    - "Resolved"

approval:
  assignee_change_requires_approval: true
  allow_apply_without_approval: false
  assigning_authorities:
    - name: "Supreet"
      jira_assignee: "supreet752006@gmail.com"
      scope:
        - "KAN"
  audit_log: "automation/output/approvals.log"

team:
  - name: "Supreet"
    jira_assignee: "supreet752006@gmail.com"
    team: "KAN"
    skills:
      - "kan"
      - "backend"
      - "full-stack"
      - "product"
      - "qa"
    components:
      - "KAN"
    labels:
      - "kan"
    max_in_progress: 2
    sprint_capacity_points: 8
    backup_assignee: "supreet752006@gmail.com"
    unavailable_dates: []
    assignment_allowlist: true

rules:
  ownership_order:
    - "component"
    - "label"
    - "skill"
    - "history"
  never_auto_assign_labels:
    - "security"
    - "architecture"
    - "needs-manager-review"
  cross_team_assignment_requires_approval: true
